<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — VendorVerse</title>
<style>
  :root{
    --blue: #5b8def;
    --blue-dark: #3f6fe0;
    --ink: #14161a;
    --sub: #4b4f58;
    --illo-bg: #eef1fb;
    --card: #dfe7fb;
    --line: #eceff3;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: #fff;
  }
  h1{ margin: 0; letter-spacing: -0.01em; }
  p{ margin: 0; }
  a{ color: inherit; text-decoration: none; }
  .bg-blob{
    position: fixed; top: -10%; right: -10%; width: 480px; height: 480px;
    background: var(--illo-bg); border-radius: 50% 45% 55% 50% / 55% 50% 50% 45%; z-index: -1;
  }
  .card{
    background: #fff; width: 100%; max-width: 400px; border: 1px solid var(--line);
    border-radius: 28px; padding: 40px 34px; box-shadow: 0 30px 60px rgba(20,22,26,0.08);
  }
  .logo{ display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--sub); margin-bottom: 28px; }
  .logo img{ width: 36px; height: 36px; object-fit: cover; border-radius: 8px; }
  h1.title{ font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  p.sub{ color: var(--sub); font-size: 14px; margin-bottom: 26px; }
  .field{ margin-bottom: 16px; }
  .field label{ display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .field input{
    width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px;
    font-size: 14px; font-family: inherit; background: #fafbfd;
  }
  .field input:focus{ outline: none; border-color: var(--blue); background: #fff; }
  .password-wrap{ position: relative; }
  .password-wrap input{ padding-right: 44px; }
  .toggle-password{
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border: none; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--sub); border-radius: 8px;
  }
  .toggle-password:hover{ color: var(--ink); background: #f0f1f4; }
  .error{ color: #c0392b; font-size: 12px; margin-top: 5px; display: none; }
  .field.invalid input{ border-color: #c0392b; }
  .field.invalid .error{ display: block; }
  .form-banner{
    display: none; align-items: center; gap: 8px; background: #fdecea; border: 1px solid #f3b9b3;
    color: #c0392b; font-size: 13px; font-weight: 600; padding: 10px 12px; border-radius: 12px; margin-bottom: 18px;
  }
  .form-banner.show{ display: flex; }
  button.submit{
    width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 15px; border: none; border-radius: 999px; background: var(--blue); color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button.submit:hover{ background: var(--blue-dark); }
  button.submit:disabled{ background: var(--card); color: var(--sub); cursor: not-allowed; }
  .success{ display: none; text-align: center; padding: 12px 0; }
  .success.show{ display: block; }
  .success .check{
    width: 56px; height: 56px; border-radius: 50%; background: var(--illo-bg); color: var(--blue);
    font-size: 26px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  }
</style>
</head>
<body>

<div class="bg-blob"></div>

<div class="card">
  <div class="logo">
    <img src="logo.jpeg" alt="VendorVerse logo">
    VendorVerse
  </div>

  <div id="resetWrap">
    <h1 class="title">Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>

    <div class="form-banner" id="resetBanner"></div>

    <form id="resetFormEl" novalidate>
      <div class="field" id="newPasswordField">
        <label for="newPassword">New password</label>
        <div class="password-wrap">
          <input type="password" id="newPassword" placeholder="At least 6 characters">
          <button type="button" class="toggle-password" data-target="newPassword" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="error">Password must be at least 6 characters.</div>
      </div>
      <div class="field" id="confirmPasswordField">
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" placeholder="Re-enter your password">
          <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="error">Passwords do not match.</div>
      </div>
      <button type="submit" class="submit" id="resetBtn">Reset password</button>
    </form>
    <p class="sub" style="margin-top:20px; text-align:center;"><a href="login.html" style="color:var(--blue); font-weight:700;">Back to log in</a></p>
  </div>

  <div class="success" id="successBox">
    <div class="check">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 class="title">Password updated</h1>
    <p class="sub">You can now log in with your new password.</p>
  </div>
</div>

<script>
  const EYE_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.66 3.94M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  function clearError(fieldId) { document.getElementById(fieldId).classList.remove('invalid'); }
  function showError(fieldId) { document.getElementById(fieldId).classList.add('invalid'); }
  function showBanner(msg) {
    const el = document.getElementById('resetBanner');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideBanner() { document.getElementById('resetBanner').classList.remove('show'); }

  if (!token) {
    showBanner('This reset link is missing its token. Request a new one from the login page.');
    document.getElementById('resetFormEl').querySelector('button').disabled = true;
  }

  const newPassword = document.getElementById('newPassword');
  const confirmPassword = document.getElementById('confirmPassword');
  newPassword.addEventListener('input', () => { clearError('newPasswordField'); hideBanner(); });
  confirmPassword.addEventListener('input', () => { clearError('confirmPasswordField'); hideBanner(); });

  document.getElementById('resetFormEl').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideBanner();
    let valid = true;
    if (newPassword.value.length < 6) { showError('newPasswordField'); valid = false; }
    if (confirmPassword.value !== newPassword.value || confirmPassword.value === '') { showError('confirmPasswordField'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('resetBtn');
    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
      const res = await fetch('api/reset_password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: newPassword.value })
      });
      const data = await res.json();
      if (!data.success) {
        showBanner(data.error || 'Could not reset your password. The link may have expired.');
        btn.disabled = false;
        btn.textContent = 'Reset password';
        return;
      }
      document.getElementById('resetWrap').style.display = 'none';
      document.getElementById('successBox').classList.add('show');
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch (err) {
      showBanner('Could not reach the server. Is your PHP/MySQL setup running?');
      btn.disabled = false;
      btn.textContent = 'Reset password';
    }
  });
</script>

</body>
</html>
